name: Draft Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and verify signed release APK
        shell: bash
        env:
          TUNELYST_KEYSTORE_BASE64: ${{ secrets.TUNELYST_KEYSTORE_BASE64 }}
          TUNELYST_KEYSTORE_FILE: ${{ runner.temp }}/tunelyst-release.jks
          TUNELYST_STORE_PASSWORD: ${{ secrets.TUNELYST_STORE_PASSWORD }}
          TUNELYST_KEY_ALIAS: ${{ secrets.TUNELYST_KEY_ALIAS }}
          TUNELYST_KEY_PASSWORD: ${{ secrets.TUNELYST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a version tag such as v1.0.0.' >&2; exit 1; }
          for name in TUNELYST_KEYSTORE_BASE64 TUNELYST_STORE_PASSWORD TUNELYST_KEY_ALIAS TUNELYST_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          umask 077
          trap 'rm -f "$TUNELYST_KEYSTORE_FILE"' EXIT
          printf '%s' "$TUNELYST_KEYSTORE_BASE64" | base64 --decode > "$TUNELYST_KEYSTORE_FILE"
          [[ -s "$TUNELYST_KEYSTORE_FILE" ]] || { echo 'Signing key is empty.' >&2; exit 1; }
          bash ./gradlew :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          [[ -f "$apk" ]] || { echo 'Expected a signed release APK.' >&2; exit 1; }
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          python3 .github/scripts/verify_apk_abis.py "$apk"
          badging=$("$tools/aapt" dump badging "$apk")
          [[ "$badging" == "package: name='com.tunelyst.player' "* ]] || { echo 'Unexpected application ID.' >&2; exit 1; }
          version=$(printf '%s\n' "$badging" | sed -n "1s/.*versionName='\([^']*\)'.*/\1/p")
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "Tag does not match the APK versionName." >&2; exit 1; }
          mkdir -p release-files
          asset="Tunelyst-$GITHUB_REF_NAME.apk"
          cp "$apk" "release-files/$asset"
          (cd release-files && sha256sum "$asset" > "$asset.sha256")
      - name: Save R8 mapping privately with the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="Tunelyst-$GITHUB_REF_NAME.apk"
          cat > "$RUNNER_TEMP/tunelyst-release-notes.txt" <<'NOTES'
          Draft release. Test the signed APK on real devices before publishing.
          Check library access, playback and background controls, sharing, search, and reopen behavior.
          NOTES
          gh release create "$GITHUB_REF_NAME" "release-files/$asset" "release-files/$asset.sha256" \
            --verify-tag --draft --title "Tunelyst $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/tunelyst-release-notes.txt"
